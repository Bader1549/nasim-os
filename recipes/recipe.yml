name: nasim-os
description: Nasim OS - a light, Windows-like Linux for coding, gaming and office. Based on Bazzite.

base-image: ghcr.io/ublue-os/bazzite
# Pinned to Fedora 44 on purpose: Bazzite's "stable" tag moves to Fedora 45
# soon after Fedora 45 ships. Switch to stable-45 after testing it.
image-version: stable-44

modules:
  - from-file: common.yml
